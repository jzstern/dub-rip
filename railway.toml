# Railway config-as-code covers service sources and build/deploy settings, but NOT
# environment variables. Cobalt additionally requires this variable, set per-environment
# via the dashboard or `railway variables --set`:
#
#   YOUTUBE_SESSION_SERVER=http://bgutil-pot.railway.internal:4416
#
# Without it, Cobalt builds no youtubei.js Player and every tunnel returns a 0-byte
# body while still reporting status:"tunnel". Point it at bgutil-pot (declared below) —
# NOT at yt-session-generator, which serves GET /token while Cobalt 11.x POSTs /get_pot.
# See docs/deployment-strategy.md#why-youtube_session_server-must-be-set

[services.cobalt-8x3f]
[services.cobalt-8x3f.source]
image = "ghcr.io/imputnet/cobalt:11.7.1@sha256:63186dd68afd57ce3bb1f62cc4c139f5fa95b9c3e87a3cf5c6e4c7a570523f62"

[services.cobalt-8x3f.deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Serves two consumers: PO tokens for the yt-dlp fallback (BGUTIL_POT_URL on the app)
# and Cobalt's YOUTUBE_SESSION_SERVER. Cobalt hard-depends on it being reachable at boot.
[services.bgutil-pot]
[services.bgutil-pot.source]
image = "brainicism/bgutil-ytdlp-pot-provider:1.3.1@sha256:1aaa43a0ca72dfca6a6d2129a0fb4a23465c25adb1b043f8aff829a20825646b"

[services.bgutil-pot.deploy]
healthcheckPath = "/ping"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
