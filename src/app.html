<!doctype html>
<html lang="en">
	<head>
		<script>
			// Blocking script to prevent dark mode flicker
			// Runs synchronously before CSS paints
			(() => {
				var prefersDark = window.matchMedia && (
					window.matchMedia('(prefers-color-scheme: dark)').matches ||
					!window.matchMedia('(prefers-color-scheme: light)').matches
				);
				if (prefersDark) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8e6e1" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1b1a" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Download YouTube audio with rich metadata" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
