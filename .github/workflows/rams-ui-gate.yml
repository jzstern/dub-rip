name: Rams UI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: rams-ui-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # Labels are an issues resource — creating one needs more than pull-requests: write.
  issues: write

jobs:
  label-ui-changes:
    # Fork PRs get a read-only token, so labelling would fail.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Label PRs that change UI meaningfully
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job never checks out, so gh has no remote to infer the repo from.
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          UI_LINE_THRESHOLD: "20"
          # Optional. Without it the quota check is skipped and the gate labels as before.
          RAMS_API_KEY: ${{ secrets.RAMS_API_KEY }}
        run: |
          set -euo pipefail

          # Echoes the remaining review count, or nothing if it cannot be determined.
          # Paid plans report no "N left" at all, so callers must treat an empty
          # result as "quota is fine" rather than as zero.
          rams_reviews_left() {
            local raw payload text
            raw=$(curl -sS --max-time 20 -X POST https://worker.rams.ai/mcp \
              -H "Authorization: Bearer ${RAMS_API_KEY}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"usage","arguments":{}}}' \
              2>/dev/null) || return 0
            payload=$(sed -n 's/^data: //p' <<<"$raw")
            [ -z "$payload" ] && payload="$raw"
            text=$(jq -r '.result.content[0].text // empty' <<<"$payload" 2>/dev/null) || return 0
            grep -oE '[0-9]+ left' <<<"$text" | grep -oE '^[0-9]+' | head -1 || true
          }

          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate)

          ui=$(jq -c '
            [ .[]
              | select(.filename | test("\\.svelte$|\\.css$|^src/app\\.html$|^tailwind\\.config\\.[cm]?[jt]s$"))
              | select(.filename | test("(^|/)(tests?|e2e)/|\\.(test|spec)\\.") | not)
            ]' <<<"$files")

          new_components=$(jq '[.[] | select(.status == "added" and (.filename | endswith(".svelte")))] | length' <<<"$ui")
          ui_lines=$(jq '[.[].changes] | add // 0' <<<"$ui")

          {
            echo "### Rams UI gate"
            echo
            echo "| Signal | Value |"
            echo "| --- | --- |"
            echo "| UI files touched | $(jq 'length' <<<"$ui") |"
            echo "| Changed lines in UI files | $ui_lines (threshold $UI_LINE_THRESHOLD) |"
            echo "| New .svelte components | $new_components |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$new_components" -eq 0 ] && [ "$ui_lines" -lt "$UI_LINE_THRESHOLD" ]; then
            echo "Not a significant UI change — leaving the PR unlabelled." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Labelling at zero quota is worse than not labelling: Rams answers
          # "limit reached", the label stays, and the `labeled` webhook never
          # fires again — so the PR would go unreviewed even after quota resets.
          if [ -n "${RAMS_API_KEY:-}" ]; then
            reviews_left=$(rams_reviews_left)
            if [ "${reviews_left:-}" = "0" ]; then
              {
                echo "| Rams reviews left | 0 |"
                echo
                echo "Quota exhausted — leaving the PR unlabelled so its review is not"
                echo "spent on a refusal. Push again after the quota resets, or add the"
                echo "\`rams\` label by hand."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "| Rams reviews left | ${reviews_left:-not reported (proceeding)} |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Create only when absent — --force would silently revert any colour or
          # description the repo has since set on a shared label.
          if ! gh label list --limit 100 --json name --jq '.[].name' | grep -qxF rams; then
            gh label create rams \
              --color 0E8A16 \
              --description "Request a Rams design review"
          fi

          # Re-adding a label GitHub already has is a no-op that fires no `labeled`
          # webhook, so pushes to an already-labelled PR cannot burn extra quota.
          gh pr edit "$PR" --add-label rams
          echo "Labelled \`rams\` — Rams will review this PR." | tee -a "$GITHUB_STEP_SUMMARY"
